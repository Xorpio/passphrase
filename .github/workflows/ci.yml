name: CI — Build & Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test --configuration Release --no-build --logger "trx" --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'

      - name: Report coverage
        run: |
          # Find coverage percentage from results (adjust path based on actual coverage format)
          COVERAGE=$(find . -name "coverage.cobertura.xml" | head -1)
          if [ -z "$COVERAGE" ]; then
            echo "⚠️  Coverage report not found — verify XPlat Code Coverage collection."
            exit 1
          fi
          
          # Extract coverage % using basic XML parsing
          COVERAGE_PCT=$(grep -oP 'line-rate="\K[^"]+' "$COVERAGE" | head -1)
          if [ -z "$COVERAGE_PCT" ]; then
            echo "⚠️  Could not parse coverage from XML."
            exit 1
          fi
          
          COVERAGE_INT=$(echo "$COVERAGE_PCT * 100" | bc | cut -d'.' -f1)
          echo "📊 Code coverage: ${COVERAGE_INT}%"
          
          if [ "$COVERAGE_INT" -lt 80 ]; then
            echo "❌ Coverage ${COVERAGE_INT}% is below 80% threshold."
            exit 1
          fi
          
          echo "✅ Coverage ${COVERAGE_INT}% meets threshold."
