name: Deploy — GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore PassphraseGenerator.slnx

      - name: Build Release
        run: dotnet build PassphraseGenerator.slnx --configuration Release --no-restore

      - name: Run tests (gate deployment)
        run: dotnet test PassphraseGenerator.slnx --configuration Release --no-build

      - name: Publish WASM app
        run: |
          dotnet publish src/PassphraseGenerator -c Release -o publish \
            -p:BlazorPathBase=/passphrase/

      - name: Add .nojekyll marker
        run: touch publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publish/wwwroot/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
