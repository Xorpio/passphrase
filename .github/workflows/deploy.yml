name: Deploy — GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10.x
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore PassphraseGenerator.slnx

      - name: Build Release
        run: dotnet build PassphraseGenerator.slnx --configuration Release --no-restore

      - name: Run tests (gate deployment)
        run: dotnet test PassphraseGenerator.slnx --configuration Release --no-build

      - name: Publish WASM app
        run: |
          dotnet publish src/PassphraseGenerator -c Release -o publish \
            -p:BlazorPathBase=/passphrase/

      - name: Fix base href for GitHub Pages subpath
        run: sed -i 's|<base href="/" />|<base href="/passphrase/" />|g' publish/wwwroot/index.html

      - name: Validate published static assets
        run: |
          set -euo pipefail

          # Ensure subpath hosting is configured correctly
          grep -q '<base href="/passphrase/" />' publish/wwwroot/index.html

          # Ensure local static libraries exist (avoid CDN + avoid 404s)
          grep -q 'lib/bootstrap/dist/css/bootstrap.min.css' publish/wwwroot/index.html
          test -f publish/wwwroot/lib/bootstrap/dist/css/bootstrap.min.css

          grep -q 'lib/bootstrap-icons/font/bootstrap-icons.min.css' publish/wwwroot/index.html
          test -f publish/wwwroot/lib/bootstrap-icons/font/bootstrap-icons.min.css
          test -f publish/wwwroot/lib/bootstrap-icons/font/fonts/bootstrap-icons.woff2
          test -f publish/wwwroot/lib/bootstrap-icons/font/fonts/bootstrap-icons.woff

          # CSS isolation is not used in this project; prevent a broken reference
          if grep -q 'PassphraseGenerator.styles.css' publish/wwwroot/index.html; then
            echo "index.html references PassphraseGenerator.styles.css but CSS isolation bundle is not present" >&2
            exit 1
          fi

          # Minimal expected assets
          test -f publish/wwwroot/css/app.css
          ls publish/wwwroot/_framework/blazor.webassembly*.js >/dev/null

      - name: Add .nojekyll marker
        run: touch publish/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'publish/wwwroot/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
